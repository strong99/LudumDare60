name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish LudumDare60/LudumDare60.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Package (zip)
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../../LudumDare60-${{ matrix.rid }}.zip .
          else
            zip -r ../../LudumDare60-${{ matrix.rid }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LudumDare60-${{ matrix.rid }}
          path: LudumDare60-${{ matrix.rid }}.zip
          if-no-files-found: error

  web:
    name: Web (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish LudumDare60.Web/LudumDare60.Web.csproj -c Release -o publish/web

      - name: Disable Jekyll (serve _framework)
        run: touch publish/web/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot

      - name: Package (zip)
        run: cd publish/web/wwwroot && zip -r ../../../LudumDare60-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: LudumDare60-web
          path: LudumDare60-web.zip
          if-no-files-found: error

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
