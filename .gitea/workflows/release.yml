name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish LudumDare60/LudumDare60.csproj
          -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish/linux-x64

      - name: Package
        run: cd publish/linux-x64 && zip -r ../../LudumDare60-linux-x64.zip .

      - uses: actions/upload-artifact@v3
        with:
          name: LudumDare60-linux-x64
          path: LudumDare60-linux-x64.zip
          if-no-files-found: error

  web:
    name: Web (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish LudumDare60.Web/LudumDare60.Web.csproj -c Release -o publish/web

      - name: Package
        run: cd publish/web/wwwroot && zip -r ../../../LudumDare60-web.zip .

      - uses: actions/upload-artifact@v3
        with:
          name: LudumDare60-web
          path: LudumDare60-web.zip
          if-no-files-found: error

  release:
    name: Gitea Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Create release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          response=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}")
          # The release's own id is the first "id" in the response.
          id=$(printf '%s' "$response" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
          [ -n "$id" ] || { echo "Could not read release id: $response"; exit 1; }
          for f in dist/*/*.zip; do
            curl -fsS -X POST "$API/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done
